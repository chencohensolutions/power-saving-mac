name: BatteryTime
options:
  bundleIdPrefix: com.hencohen
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "4.0"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  BatteryTime:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BatteryTime
        LSUIElement: true
        AppGroup: $(TeamIdentifierPrefix)com.hencohen.batterytime
        # Phone Companion (App/CompanionServer.swift): a server on the local network, advertised over Bonjour
        NSLocalNetworkUsageDescription: BatteryTime lets the companion app on your phone see and control it while the lid is closed.
        NSBonjourServices:
          - _batterytime._tcp
    entitlements:
      path: App/BatteryTime.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.hencohen.batterytime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hencohen.batterytime
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BatteryTimeControls
  BatteryTimeControls:
    type: app-extension
    platform: macOS
    sources: [Controls, Shared]
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: BatteryTime
        AppGroup: $(TeamIdentifierPrefix)com.hencohen.batterytime
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Controls/BatteryTimeControls.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.hencohen.batterytime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hencohen.batterytime.controls
